<style>
:root {

  flex: 0 0 50px;

  display: flex;
  align-items: center;

.ad-banner-inner {
  width: 320px;

}

  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
}

#playArea {
  flex: 1;
  min-height: 0;
  width: 100%;
  height: 100%;
  position: relative;
  overflow: hidden;
  isolation: isolate;
  background: #090c1c;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}

#playArea::before {
  content: "";

  inset: 0;
  z-index: -1;
  opacity: .25;
  background-image:
    linear-gradient(#8b9bff12 1px, transparent 1px),

  background-size: 30px 30px;
  pointer-events: none;
}

.empty-message {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 20px;
  color: #aeb6d8;
  pointer-events: none;
  line-height: 1.9;
}

.empty-message strong {
  color: #f5f7ff;
  font-size: 23px;
  font-weight: 900;
}

.empty-message span {
  font-size: 14px;
  margin-top: 5px;
}

.hand-icon {
  width: 72px;
  height: 72px;
  margin-bottom: 12px;
  fill: none;
  stroke: var(--cyan);
  filter: drop-shadow(0 0 12px #45e6ff66);
  animation: floatHand 2s ease-in-out infinite alternate;
}

@keyframes floatHand {
  from { transform: translateY(0); }
  to { transform: translateY(-10px); }
}

.sound-toggle {
  position: absolute;
  top: 14px;
  right: 14px;
  z-index: 50;
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
  padding: 0;
  border: 1px solid #ffffff47;
  border-radius: 50%;
  background: #ffffff12;
  color: white;
  cursor: pointer;
  backdrop-filter: blur(8px);
}

.sound-toggle:active {
  transform: scale(.92);
}

.sound-toggle svg {
  width: 22px;
  height: 22px;
  fill: currentColor;
}

.finger {
  position: absolute;
  width: 112px;
  height: 112px;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  display: grid;
  place-items: center;
  z-index: 3;
  pointer-events: none;
  --finger-color: #45e6ff;
  will-change: left, top;
}

.finger .ring {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 4px solid var(--finger-color);
  background: color-mix(in srgb, var(--finger-color) 17%, transparent);
  box-shadow:
    0 0 20px color-mix(in srgb, var(--finger-color) 80%, transparent),
    inset 0 0 22px color-mix(in srgb, var(--finger-color) 25%, transparent);
}

.finger .core {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: var(--finger-color);
  box-shadow: 0 0 24px var(--finger-color);
  position: relative;
  z-index: 1;
}

.finger .number {
  position: absolute;
  top: -29px;
  font-size: 15px;
  font-weight: 900;
  color: white;
  text-shadow: 0 1px 8px #000;
}

.finger.lit {
  z-index: 5;
  filter: brightness(1.6);
}

.finger.lit .ring {
  background: color-mix(in srgb, var(--finger-color) 42%, transparent);
  box-shadow:
    0 0 22px var(--finger-color),
    0 0 42px var(--finger-color),
    0 0 65px color-mix(in srgb, var(--finger-color) 60%, transparent);
  animation: pulse .45s ease-in-out infinite alternate;
}

@keyframes pulse {
  from { transform: scale(.9); }
  to { transform: scale(1.15); }
}

#playArea.choosing .finger {
  transition: filter .12s;
}

.finger.selected .ring {
  animation: selectedRing .7s ease-out forwards;
}

@keyframes selectedRing {
  from {
    transform: scale(1);
    opacity: 1;
  }
  to {
    transform: scale(1.28);
    opacity: .9;
  }
}

.hidden {
  display: none !important;
}

#winnerScreen {
  position: fixed;
  inset: 0;
  z-index: 1000;
  overflow: hidden;
  background: transparent;
  display: none;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 25px;
  isolation: isolate;
}

#winnerScreen.show {
  display: flex;
}

#winnerColor {
  position: absolute;
  z-index: 0;
  width: 112px;
  height: 112px;
  border-radius: 50%;
  transform: translate(-50%, -50%) scale(1);
  background: var(--winner-color, #45e6ff);
  box-shadow:
    0 0 55px var(--winner-color, #45e6ff),
    0 0 100px var(--winner-color, #45e6ff);
  animation: expandWinnerSlow 12s linear forwards;
  will-change: transform;
}

@keyframes expandWinnerSlow {
  0% {
    transform: translate(-50%, -50%) scale(1);
  }
  100% {
    transform: translate(-50%, -50%) scale(80);
  }
}

.winner-content {
  position: relative;
  z-index: 2;
  width: min(100%, 400px);
  opacity: 0;
  color: white;
  font-family: 'Cairo', sans-serif;
  animation: revealWinner .5s ease .15s forwards;
}

@keyframes revealWinner {
  to { opacity: 1; }
}

.winner-label {
  font-family: system-ui, sans-serif;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 5px;
  margin-bottom: 18px;
  opacity: .85;
}

.winner-content h2 {
  font-size: clamp(30px, 8vw, 44px);
  line-height: 1.5;
  margin: 0 0 12px;
  font-weight: 900;
  text-shadow: 0 3px 18px #0003;
}

.winner-content p {
  font-size: 18px;
  font-weight: 700;
  margin: 0 0 28px;
}

.winner-content button {
  width: 100%;
  padding: 16px;
  border-radius: 16px;
  background: white;
  color: #15172b;
  font-family: 'Cairo', sans-serif;
  font-weight: 900;
  font-size: 17px;
  border: 0;
  cursor: pointer;
  box-shadow: 0 10px 25px #0003;
  transition: transform .15s ease;
}

.winner-content button:active {
  transform: scale(.96);
}

@media (max-width: 400px) {
  .finger {
    width: 100px;
    height: 100px;
  }

  .empty-message strong {
    font-size: 21px;
  }
}

@media (prefers-reduced-motion: reduce) {
  .hand-icon {
    animation: none;
  }
}
</style>
</head>

<script>
(() => {
  "use strict";

  const MAX_FINGERS = 30;
  const ROUND_DURATION = 12;
  const SWEEP_INTERVAL = 160;

  const SMARTLINK_URL =
    "https://www.profitableratecpmnetwork.com/d6mid86v?key=90c984c8fd10e21cd01541eb4207aa2c";

  const colors = [
    "#45e6ff", "#ff4fa3", "#a18aff", "#70ff9b",
    "#ffb84d", "#ff657a", "#62a8ff", "#f4f76b",
    "#e879ff", "#52ffd0", "#ff8c42", "#b7a0ff",
    "#00d9ff", "#ff5bda", "#c5ff68"
  ];

  const playArea = document.getElementById("playArea");
  const emptyMessage = document.getElementById("emptyMessage");
  const winnerScreen = document.getElementById("winnerScreen");
  const winnerColor = document.getElementById("winnerColor");
  const winnerTitle = document.getElementById("winnerTitle");
  const winnerDescription = document.getElementById("winnerDescription");
  const playAgainBtn = document.getElementById("playAgainBtn");
  const soundToggle = document.getElementById("soundToggle");
  const soundIcon = document.getElementById("soundIcon");

  let fingers = new Map();
  let nextId = 1;
  let choosing = false;
  let winnerFound = false;
  let sweepTimer = null;
  let countdownTimer = null;
  let roundToken = 0;
  let audioCtx = null;
  let soundEnabled = true;

  function initAudio() {
    try {
      if (!audioCtx) {
        const AudioContextClass =
          window.AudioContext || window.webkitAudioContext;

        if (!AudioContextClass) return;

        audioCtx = new AudioContextClass();
      }

      if (audioCtx.state === "suspended") {
        audioCtx.resume().catch(() => {});
      }
    } catch (_) {}
  }

  function playTone(frequency, duration, volume = 0.1, type = "sine") {
    if (!soundEnabled) return;

    initAudio();
    if (!audioCtx) return;

    try {
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = type;
      osc.frequency.setValueAtTime(frequency, now);

      gain.gain.setValueAtTime(volume, now);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(now);
      osc.stop(now + duration + 0.01);
    } catch (_) {}
  }

  function playTouchSound() {
    if (!soundEnabled) return;

    initAudio();
    if (!audioCtx) return;

    try {
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = "sine";
      osc.frequency.setValueAtTime(520, now);
      osc.frequency.exponentialRampToValueAtTime(880, now + 0.08);

      gain.gain.setValueAtTime(0.15, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(now);
      osc.stop(now + 0.09);
    } catch (_) {}
  }

  function playSweepSound(stepIndex) {
    const baseFreqs = [
      349.23, 392.00, 440.00, 523.25,
      587.33, 659.25, 698.46, 783.99
    ];

    playTone(
      baseFreqs[stepIndex % baseFreqs.length],
      0.14,
      0.08,
      "triangle"
    );
  }

  function playWinSound() {
    if (!soundEnabled) return;

    initAudio();
    if (!audioCtx) return;

    const notes = [523.25, 659.25, 783.99, 1046.50];

    notes.forEach((frequency, index) => {
      try {
        const start = audioCtx.currentTime + index * 0.1;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = "sine";
        osc.frequency.setValueAtTime(frequency, start);

        gain.gain.setValueAtTime(0, start);
        gain.gain.linearRampToValueAtTime(0.2, start + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.6);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(start);
        osc.stop(start + 0.65);
      } catch (_) {}
    });
  }

  function getColor(id) {
    return colors[(id - 1) % colors.length];
  }

  function updateSoundButton() {
    soundToggle.setAttribute("aria-pressed", String(soundEnabled));
    soundToggle.setAttribute(
      "aria-label",
      soundEnabled ? "كتم الصوت" : "فتح الصوت"
    );

    soundIcon.innerHTML = soundEnabled
      ? `
        <path d="M4 9v6h4l5 4V5L8 9H4z"></path>
        <path d="M16 9.5a4 4 0 0 1 0 5m2.5-7.5a7.5 7.5 0 0 1 0 10"
          fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round"></path>
      `
      : `
        <path d="M4 9v6h4l5 4V5L8 9H4z"></path>
        <path d="M16.5 8.5l5 5m0-5l-5 5"
          fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round"></path>
      `;
  }

  function updateUI() {
    emptyMessage.classList.toggle("hidden", fingers.size > 0);
  }

  function getPosition(event) {
    const rect = playArea.getBoundingClientRect();

    return {
      x: Math.max(0, Math.min(rect.width, event.clientX - rect.left)),
      y: Math.max(0, Math.min(rect.height, event.clientY - rect.top))
    };
  }

  function moveFinger(finger, x, y) {
    finger.x = x;
    finger.y = y;

    finger.el.style.left = `${x}px`;
    finger.el.style.top = `${y}px`;
  }

  function createFinger(pointerId, x, y) {
    const id = nextId++;
    const el = document.createElement("div");

    el.className = "finger";
    el.dataset.id = String(id);
    el.style.setProperty("--finger-color", getColor(id));

    el.innerHTML = `
      <div class="ring"></div>
      <div class="core"></div>
      <div class="number">${id}</div>
    `;

    playArea.appendChild(el);

    const finger = { id, pointerId, x, y, el };

    fingers.set(pointerId, finger);
    moveFinger(finger, x, y);
    playTouchSound();

    return finger;
  }

  function clearSweep() {
    if (sweepTimer !== null) {
      clearInterval(sweepTimer);
      sweepTimer = null;
    }

    fingers.forEach(finger => {
      finger.el.classList.remove("lit");
    });
  }

  function startSweep() {
    clearSweep();

    let index = 0;

    function step() {
      if (!choosing || winnerFound) return;

      const currentFingers = Array.from(fingers.values());

      currentFingers.forEach(finger => {
        finger.el.classList.remove("lit");
      });

      if (!currentFingers.length) return;

      const finger = currentFingers[index % currentFingers.length];

      if (finger && finger.el.isConnected) {
        finger.el.classList.add("lit");
        playSweepSound(index);
      }

      index++;
    }

    step();
    sweepTimer = setInterval(step, SWEEP_INTERVAL);
  }

  function startChoosing() {
    if (choosing || winnerFound || fingers.size < 2) return;

    choosing = true;
    const thisRound = ++roundToken;

    playArea.classList.add("choosing");
    startSweep();

    countdownTimer = setTimeout(() => {
      if (thisRound !== roundToken || !choosing || winnerFound) return;

      countdownTimer = null;
      chooseWinner();
    }, ROUND_DURATION * 1000);
  }

  function cancelChoosing() {
    roundToken++;

    if (countdownTimer !== null) {
      clearTimeout(countdownTimer);
      countdownTimer = null;
    }

    clearSweep();
    choosing = false;
    playArea.classList.remove("choosing");
  }

  function chooseWinner() {
    if (!choosing || winnerFound) return;

    clearSweep();

    if (countdownTimer !== null) {
      clearTimeout(countdownTimer);
      countdownTimer = null;
    }

    const candidates = Array.from(fingers.values()).filter(
      finger =>
        finger.el.isConnected &&
        fingers.get(finger.pointerId) === finger
    );

    if (candidates.length === 0) {
      resetGame();
      return;
    }

    const randomIndex = Math.floor(Math.random() * candidates.length);
    const winner = candidates[randomIndex];

    winnerFound = true;
    choosing = false;
    roundToken++;

    playArea.classList.remove("choosing");

    fingers.forEach(finger => {
      finger.el.classList.remove("lit");
    });

    winner.el.classList.add("selected");
    playWinSound();

    const rect = playArea.getBoundingClientRect();

    winnerColor.style.left = `${rect.left + winner.x}px`;
    winnerColor.style.top = `${rect.top + winner.y}px`;
    winnerColor.style.setProperty("--winner-color", getColor(winner.id));

    winnerColor.style.animation = "none";
    void winnerColor.offsetWidth;
    winnerColor.style.animation =
      "expandWinnerSlow 12s linear forwards";

    winnerTitle.textContent = "تم اختيار اللاعب";
    winnerDescription.textContent = `الفائز هو الإصبع رقم ${winner.id}`;

    winnerScreen.classList.add("show");
  }

  function removeFinger(pointerId) {
    const finger = fingers.get(pointerId);

    if (!finger) return;

    fingers.delete(pointerId);
    finger.el.remove();

    updateUI();

    if (choosing && !winnerFound && fingers.size < 2) {
      cancelChoosing();
    }

    if (fingers.size === 0 && !winnerFound) {
      resetGame();
    }
  }

  function handlePointerEnd(event) {
    if (winnerFound) return;
    removeFinger(event.pointerId);
  }

  soundToggle.addEventListener("click", event => {
    event.stopPropagation();

    soundEnabled = !soundEnabled;

    if (soundEnabled) initAudio();

    updateSoundButton();
  });

  playArea.addEventListener("pointerdown", event => {
    if (winnerFound) return;
    if (event.target.closest("#soundToggle")) return;
    if (fingers.has(event.pointerId)) return;
    if (fingers.size >= MAX_FINGERS) return;

    event.preventDefault();

    const pos = getPosition(event);

    createFinger(event.pointerId, pos.x, pos.y);

    try {
      playArea.setPointerCapture(event.pointerId);
    } catch (_) {}

    updateUI();

    if (fingers.size >= 2 && !choosing) {
      startChoosing();
    }
  });

  playArea.addEventListener("pointermove", event => {
    const finger = fingers.get(event.pointerId);

    if (!finger || winnerFound) return;

    event.preventDefault();

    const pos = getPosition(event);
    moveFinger(finger, pos.x, pos.y);
  });

  playArea.addEventListener("pointerup", handlePointerEnd);
  playArea.addEventListener("pointercancel", handlePointerEnd);

  playArea.addEventListener("lostpointercapture", event => {
    handlePointerEnd(event);
  });

  function resetGame() {
    roundToken++;

    if (sweepTimer !== null) {
      clearInterval(sweepTimer);
      sweepTimer = null;
    }

    if (countdownTimer !== null) {
      clearTimeout(countdownTimer);
      countdownTimer = null;
    }

    choosing = false;
    winnerFound = false;

    winnerScreen.classList.remove("show");
    playArea.classList.remove("choosing");

    fingers.forEach(finger => finger.el.remove());
    fingers.clear();

    nextId = 1;

    winnerColor.style.animation = "none";

    updateUI();
  }

  playAgainBtn.addEventListener("click", () => {
    window.open(
      SMARTLINK_URL,
      "_blank",
      "noopener,noreferrer"
    );

    resetGame();
  });

  updateSoundButton();
  updateUI();
})();
</script>

</body>
</html>
